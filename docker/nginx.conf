server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/html text/css application/javascript;

    # 폐쇄망 · 외부 로드 차단
    add_header Content-Security-Policy
      "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; worker-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types text/html text/css application/javascript;
    gzip_min_length 1024;

    # 데이터 갱신이 잦으므로 HTML은 캐시하지 않음
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── 서버단 인증 (선택) ──────────────────────────────
    # .htpasswd 파일이 있으면 Basic 인증을 걸어 파일 자체를 보호합니다.
    # HTML 안의 로그인과 달리, 인증 전에는 파일을 내려받을 수 없습니다.
    #   생성 · docker/make_htpasswd.sh
    location / {
        auth_basic           "IT Infra Standardization Portal";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ /index.html;
    }
}

/* ── 자산 → 패치 유형 분류 ── */
function lineOf(v){
  const c = P.cleanVer(v);
  if(!c) return null;
  const p = c.split('.');
  return p[0]+'.'+(p[1]||'0');
}
function patchType(r){
  if(r[17]==='표준준수') return '해당없음';
  if((r[13]||'').toUpperCase()==='O' || /EOL/i.test(r[15]||'')) return 'EOS 전환';
  const cur = lineOf(r[10]);
  const recs = (r[11]||'').split(',').map(s=>lineOf(s)).filter(Boolean);
  if(!cur || !recs.length) return '미분류';
  return recs.includes(cur) ? '정기(마이너)' : '메이저(라인전환)';
}

      <td style="font-size:11px;color:var(--sub)">${esc(t.ex)}</td></tr>`;

  h += `</tbody></table></div>
    <div class="note"><b>긴급(보안)</b> 은 CVSS·KEV 기준이라 현재 자산 원장만으로는 산출할 수 없습니다.

  h += `</ol>${src('인프라 패치 프로세스 표준')}</div>`;

/* ══════════ 표준화 버전 검증 ══════════ */
function ruleStat(kind){
  switch(kind){
    case 'below': { const n = A.filter(r=>r[21]==='미달').length;
      return {n, label:'하한 미달', goto:{below:'미달'}}; }
    case 'eos':   { const n = A.filter(r=>(r[13]||'').toUpperCase()==='O').length;
      return {n, label:'EOS 도래 운영중', goto:{v:'전환대상'}}; }
    case 'jdk':   { const n = A.filter(r=>r[1]==='WAS' && !r[9]).length;
      return {n, label:'WAS 중 JDK 미기재', goto:{layer:'WAS'}}; }
    case 'inv':   { const n = INV.reduce((s,i)=>s+i.n,0);
      return {n, label:'권고역전', goto:null}; }
    case 'src':   return {n:null, label:'원장에 출처 컬럼 없음'};
    case 'cve':   return {n:null, label:'원장에 CVE 컬럼 없음'};
    default:      return {n:null, label:''};
  }
}

    let cur;
    if(!r[5] || st.n === null)
      cur = `<span style="color:var(--mut);font-size:11px">${esc(st.label||'—')}</span>`;
    else if(st.n === 0)
      cur = `<span class="bd bd-g">위반 없음</span>`;
    else
      cur = st.goto
        ? `<button class="lnk" data-goto='${JSON.stringify(st.goto)}'>${esc(st.label)} ${st.n}건</button>`
        : `<span class="bd bd-a">${esc(st.label)} ${st.n}건</span>`;
    return `<tr class="${i%2?'alt':''}">
      <td class="nw"><b style="color:var(--g-d);font-family:var(--mono)">${esc(r[0])}</b></td>
      <td class="nw"><span class="bd bd-n">${esc(r[1])}</span></td>
      <td style="font-size:11.5px">${esc(r[2])}</td>
      <td class="nw" style="font-size:11px;color:var(--sub)">${esc(r[3])}</td>
      <td class="nw" style="font-size:11px;color:var(--sub)">${esc(r[4])}</td>
      <td class="nw">${cur}</td></tr>`;
  }).join('');
  h += `</tbody></table></div>${src('06_범례_판정규칙 · 02_자산RAWDATA')}</div>`;

  /* 계층별 검증 근거 */
  h += `<div class="card"><h3>계층별 표준 도출 근거</h3><div class="grid2">`;
  h += REF.basis.map(L=>`<div class="lcard">
    <div class="lc-h">${esc(L.layer)}</div>
    <div class="lc-p">${esc(L.products)}</div>
    <div style="font-size:11.5px;line-height:1.6;margin:8px 0">${esc(L.how)}</div>
    <dl class="lc-kv"><dt>검증 근거</dt><dd>${esc(L.verify)}</dd></dl></div>`).join('');
  h += `</div>${src('01_표준_권고버전마스터 · 04_검증출처')}</div>`;

  $('#tab-verify').innerHTML = h;
  bindRows($('#tab-verify'));
}
</script>
